spring:
  application:
    name: linepilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linepilot}
    username: ${DB_USERNAME:linepilot}
    password: ${DB_PASSWORD:linepilot_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  demo-data: ${APP_DEMO_DATA:true}
  sse-timeout: ${SSE_TIMEOUT_MS:300000}
