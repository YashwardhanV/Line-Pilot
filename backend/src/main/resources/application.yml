spring:
  application:
    name: linepilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/linepilot}
    username: ${DB_USERNAME:linepilot}
    password: ${DB_PASSWORD:linepilot_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  # Behind Nginx, take the client IP from X-Forwarded-For (trusted only from internal proxy IPs).
  forward-headers-strategy: native
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  demo-data: ${APP_DEMO_DATA:true}
  sse-timeout: ${SSE_TIMEOUT_MS:300000}
  rate-limit:
    joins-per-ip: ${JOINS_PER_IP_PER_10_MIN:5}
    failed-logins-per-ip: ${FAILED_LOGINS_PER_IP:5}
